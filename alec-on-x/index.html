<!--
  X bio link. Short because X caps the website field at 100 characters, and the
  tagged VSL url is 108 on its own.

  Points at the VSL rather than straight at the calendar — Alec's call. The VSL
  stores these utms in sessionStorage and hands them to the cal.com embed as
  booking-field prefills (see buildCalPrefill in 100k-offer-lp/src/lib/cal.ts),
  so the source survives the trip through the funnel.

  That prefill only sticks if the event it books into —
  aleckrem/audience-building-strategy-session — has matching hidden booking
  questions. Cal silently drops prefills with no matching field.
-->
<link rel="canonical" href="https://100k-offer.rallyup.team/lp">
<meta http-equiv="refresh" content="0; url=https://100k-offer.rallyup.team/lp?utm_source=twitter&amp;utm_medium=profile&amp;utm_campaign=alec&amp;utm_content=x_bio">
